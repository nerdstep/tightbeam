<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xtalk</title>
  <style>
    :root {
      --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #77776f;
      --border: #e2e2dc; --accent: #2f6fed; --mine: #e8effd;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --panel: #1f1f1d; --text: #ecece8; --muted: #8d8d85;
        --border: #30302d; --accent: #6e9bff; --mine: #22304d;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      display: grid; grid-template-rows: auto 1fr auto; max-width: 900px; margin: 0 auto;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 17px; margin: 0; }
    #status { font-size: 13px; color: var(--muted); }
    #users { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
    main { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .msg { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 6px 10px; max-width: 80%; align-self: flex-start; overflow-wrap: anywhere; }
    .msg.mine { background: var(--mine); align-self: flex-end; }
    .msg .meta { font-size: 12px; color: var(--muted); }
    .msg .meta b { color: var(--text); font-weight: 600; margin-right: 6px; }
    .msg .body { white-space: pre-wrap; }
    .system { align-self: center; font-size: 12px; color: var(--muted); }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    input, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); }
    input { flex: 1; min-width: 0; background: var(--panel); color: var(--text); }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    #join { display: grid; place-content: center; gap: 10px; padding: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>xtalk</h1>
    <span id="status">not connected</span>
    <span id="users"></span>
  </header>

  <form id="join" style="grid-row: 2">
    <label for="name">Pick a name to join</label>
    <input id="name" maxlength="32" autocomplete="nickname" required autofocus>
    <button>Join</button>
  </form>

  <main id="log" hidden></main>
  <form id="compose" hidden>
    <input id="text" maxlength="2000" placeholder="Message" autocomplete="off" required>
    <button>Send</button>
  </form>

  <script>
    const $ = (id) => document.getElementById(id);
    let me = '';

    try { $('name').value = localStorage.getItem('xtalk-name') || ''; } catch {}

    $('join').addEventListener('submit', (e) => {
      e.preventDefault();
      me = $('name').value.trim();
      if (!me) return;
      try { localStorage.setItem('xtalk-name', me); } catch {}
      $('join').hidden = true;
      $('log').hidden = $('compose').hidden = false;
      $('text').focus();
      connect();
    });

    function connect() {
      const es = new EventSource('/events?name=' + encodeURIComponent(me));
      es.onopen = () => ($('status').textContent = 'connected as ' + me);
      es.onerror = () => ($('status').textContent = 'reconnecting…'); // EventSource retries on its own
      es.addEventListener('history', (e) => {
        $('log').replaceChildren();
        JSON.parse(e.data).forEach(render);
      });
      es.addEventListener('message', (e) => render(JSON.parse(e.data)));
      es.addEventListener('users', (e) => {
        const list = JSON.parse(e.data);
        $('users').textContent = list.length + ' online: ' + list.join(', ');
      });
    }

    function render(msg) {
      const log = $('log');
      const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      const el = document.createElement('div');
      if (msg.system) {
        el.className = 'system';
        el.textContent = msg.text;
      } else {
        el.className = 'msg' + (msg.name === me ? ' mine' : '');
        const meta = document.createElement('div');
        meta.className = 'meta';
        const who = document.createElement('b');
        who.textContent = msg.name;
        meta.append(who, new Date(msg.ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
        const body = document.createElement('div');
        body.className = 'body';
        body.textContent = msg.text;
        el.append(meta, body);
      }
      log.append(el);
      if (nearBottom || msg.name === me) log.scrollTop = log.scrollHeight;
    }

    $('compose').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = $('text').value.trim();
      if (!text) return;
      $('text').value = '';
      const r = await fetch('/send', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: me, text }),
      }).catch(() => null);
      if (!r || !r.ok) { $('text').value = text; $('status').textContent = 'send failed, try again'; }
    });
  </script>
</body>
</html>
