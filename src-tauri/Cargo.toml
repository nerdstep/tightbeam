[package]
name = "tightbeam"
version = "0.4.0"
description = "Private peer-to-peer chat between two people on the same network"
edition = "2024"

[lib]
name = "tightbeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
iroh = "1.5"
iroh-mdns-address-lookup = "0.6"
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1.8"
n0-future = "0.3"
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
