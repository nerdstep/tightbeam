# One pull request per ecosystem per month for minor and patch updates. Major
# updates come one per pull request, since they're the ones that need reading.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      bun:
        update-types: [minor, patch]
