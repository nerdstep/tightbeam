name: Release

# Pushing a version tag (scripts/release.ps1 does it) checks the tagged commit, then
# builds the Windows installer and the macOS app into a draft GitHub release. The
# release text is the version's section of CHANGELOG.md plus release-footer.md.
# Check the draft, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    name: Draft release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/Cargo.toml"
            exit 1
          fi
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The lines between "## <version> ..." and the next "## " heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entries under \"## $version\""
            exit 1
          fi
          { echo; cat .github/release-footer.md; } >> notes.md
          cat notes.md
      # Created once here rather than by each build, so the two builds can't race to
      # create two drafts. A re-run reuses the existing draft and refreshes its text.
      - name: Create the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@notes.md > /dev/null
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Tightbeam ${GITHUB_REF_NAME#v}" \
              -F body=@notes.md \
              -F draft=true \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, which is all Tightbeam targets.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: rustup toolchain install stable --profile minimal && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # Builds the bundle targets in tauri.conf.json (the NSIS installer on Windows; the
      # .app and .dmg on macOS) and uploads them to the draft. tauri.release.conf.json
      # adds the updater's files: each update signed with the private key from the
      # repository secrets (the .exe itself on Windows, the .app as a .tar.gz on macOS),
      # and latest.json, which installed apps read once the release is published.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json
