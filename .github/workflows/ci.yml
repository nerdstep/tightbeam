name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Type-check, lint, format check
        run: bun run check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # GitHub's macOS VMs don't deliver mDNS multicast, so the two-peer test can't
          # find its other peer there. It runs on Windows.
          - os: macos-latest
            test-args: -- --skip pair_chat_and_catch_up
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The Rust build embeds the built UI (frontendDist), so it has to exist first.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked ${{ matrix.test-args }}
