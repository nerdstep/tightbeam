name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these checks on the tagged commit before building it.
  workflow_call:

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit hashes, with the version in a comment. Dependabot
# keeps both up to date.
jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Type-check, lint, format check
        run: bun run check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # GitHub's macOS VMs don't deliver mDNS multicast, so the two-peer test can't
          # find its other peer there. It runs on Windows.
          - os: macos-latest
            test-args: -- --skip pair_chat_and_catch_up
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The runners come with rustup; this brings stable up to date.
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # The Rust build embeds the built UI (frontendDist), so it has to exist first.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked ${{ matrix.test-args }}
